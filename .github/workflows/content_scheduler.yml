name: Autonomous Content Generator

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Content Script
        run: python main.py

      - name: Commit and push generated content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "AI Agent Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add .
          git commit -m "🤖 توليد محتوى جديد تلقائياً عبر نظام بايثون المستقل" || exit 0
          git push
